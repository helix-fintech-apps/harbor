# Categories for auto-generated release notes (`gh release create --generate-notes`).
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Money / ledger changes
      labels: [money]
    - title: Database migrations
      labels: [migration]
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [bug, fix]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
