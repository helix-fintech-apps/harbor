name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "27 5 * * 1" # weekly, Monday 05:27 UTC: picks up new queries on unchanged code
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    # The ruleset requires the "CodeQL" check that code scanning posts from these results
    # (and a code_scanning rule); see docs/BRANCH_PROTECTION.md.
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - dist
              - coverage
              - playwright-report
              - test-results
              - supabase/.temp
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
